<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLYAI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e13;
  --surface:#0f1419;
  --card:#141c24;
  --card2:#192130;
  --border:#1e2d3d;
  --border2:#253545;
  --accent:#00c896;
  --accent2:#00a87e;
  --warn:#f5a623;
  --danger:#e85555;
  --muted:#3d5268;
  --muted2:#527090;
  --text:#b8cfe0;
  --text2:#7a9db8;
  --white:#e8f4ff;
}

body{
  background:transparent;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text);
  width:100vw;
  height:100vh;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  overflow:hidden;
}

/* ── TASKBAR ── */
#taskbar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:40px;
  background:#1a2332;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:0 12px;
  gap:8px;
  z-index:100;
}

.tray-clock{
  font-size:11px;
  color:var(--text2);
  text-align:right;
  line-height:1.3;
  margin-right:4px;
}

.tray-icon{
  width:32px;height:32px;
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  background:var(--card);
  border:1px solid var(--border);
  transition:all .15s;
  position:relative;
}
.tray-icon:hover{background:var(--card2);border-color:var(--accent)}
.tray-icon svg{width:16px;height:16px}

.notif-badge{
  position:absolute;
  top:-3px;right:-3px;
  width:14px;height:14px;
  border-radius:50%;
  background:var(--danger);
  font-size:9px;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;
}

/* ── PANEL ── */
#panel{
  position:fixed;
  bottom:48px;right:8px;
  width:380px;
  max-height:calc(100vh - 60px);
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:10px 10px 4px 4px;
  box-shadow:0 -8px 40px rgba(0,0,0,0.6);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:transform .2s cubic-bezier(.34,1.2,.64,1), opacity .15s;
  z-index:200;
}
#panel.open{
  transform:translateY(0);
  opacity:1;
  pointer-events:all;
}

/* Panel header */
.panel-header{
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.panel-logo{
  width:28px;height:28px;
  border-radius:6px;
  background:linear-gradient(135deg,#00c896,#0a7a5e);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#000;
}
.panel-title{font-size:13px;font-weight:600;color:var(--white);flex:1}
.panel-sub{font-size:10px;color:var(--muted2)}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* Stats row */
.stats-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--border);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.stat-cell{
  background:var(--surface);
  padding:8px 10px;
  text-align:center;
}
.stat-val{font-size:18px;font-weight:700;color:var(--accent);line-height:1}
.stat-lbl{font-size:9px;color:var(--muted2);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}

/* Tabs */
.tabs{
  display:flex;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:var(--card);
}
.tab{
  flex:1;padding:8px 4px;
  font-size:10px;font-weight:500;
  color:var(--muted2);
  cursor:pointer;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.08em;
  border-bottom:2px solid transparent;
  transition:all .15s;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Content scroll area */
.panel-body{
  flex:1;
  overflow-y:auto;
  min-height:0;
}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-track{background:transparent}
.panel-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* Cluster cards */
.cluster-card{
  border-bottom:1px solid var(--border);
  padding:10px 14px;
  transition:background .1s;
  animation:fadeUp .3s ease-out;
}
.cluster-card:hover{background:var(--card)}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.cluster-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.cluster-q{flex:1;font-size:11px;color:var(--text);line-height:1.4}
.outcome-badge{
  padding:2px 6px;border-radius:3px;
  font-size:9px;font-weight:700;
  letter-spacing:.06em;flex-shrink:0;
}
.yes{background:rgba(0,200,150,.12);color:var(--accent);border:1px solid rgba(0,200,150,.25)}
.no{background:rgba(232,85,85,.12);color:var(--danger);border:1px solid rgba(232,85,85,.25)}

.conv-bar-wrap{display:flex;align-items:center;gap:6px;margin:5px 0}
.conv-track{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.conv-fill{height:100%;border-radius:2px;transition:width .6s ease}
.conv-score{font-size:10px;font-weight:700;min-width:24px;text-align:right}

.cluster-meta{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:4px;margin-top:5px;
}
.meta-item{background:var(--card);border-radius:3px;padding:4px 6px}
.meta-label{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em}
.meta-val{font-size:11px;font-weight:600;color:var(--text);margin-top:1px}

.tg-sent{
  display:inline-flex;align-items:center;gap:3px;
  font-size:9px;color:var(--warn);margin-top:4px;
}

/* Wallet table */
.wallet-table{width:100%;border-collapse:collapse}
.wallet-table th{
  font-size:9px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted2);padding:6px 8px;
  text-align:left;border-bottom:1px solid var(--border);
  background:var(--card);position:sticky;top:0;
}
.wallet-table th:not(:first-child){text-align:right}
.wallet-table td{
  padding:5px 8px;font-size:10px;
  border-bottom:1px solid rgba(30,45,61,.6);
  color:var(--text);
}
.wallet-table td:not(:first-child){text-align:right}
.wallet-table tr:hover td{background:var(--card)}
.w-addr{color:var(--accent);font-size:10px}
.w-rank{color:var(--muted2);font-size:9px}
.pos{color:var(--accent)}
.neg{color:var(--danger)}

/* Alert log */
.alert-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;
  border-bottom:1px solid var(--border);
}
.alert-icon{font-size:14px;flex-shrink:0}
.alert-q{flex:1;font-size:10px;color:var(--text);line-height:1.3}
.alert-meta{font-size:9px;color:var(--muted2);margin-top:2px}
.alert-score{font-size:12px;font-weight:700;flex-shrink:0}

/* Footer actions */
.panel-footer{
  border-top:1px solid var(--border);
  padding:8px 14px;
  display:flex;gap:6px;
  flex-shrink:0;
  background:var(--card);
}
.btn{
  flex:1;padding:6px;border-radius:4px;
  font-family:inherit;font-size:10px;font-weight:600;
  cursor:pointer;border:1px solid var(--border2);
  background:var(--card2);color:var(--text);
  text-transform:uppercase;letter-spacing:.06em;
  transition:all .15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2);color:#000}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Toast */
#toast{
  position:fixed;bottom:50px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--card2);border:1px solid var(--border2);
  border-radius:6px;padding:7px 14px;
  font-size:11px;color:var(--text);
  opacity:0;transition:all .2s;pointer-events:none;
  white-space:nowrap;z-index:999;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty state */
.empty{
  text-align:center;padding:32px 16px;
  color:var(--muted2);font-size:11px;line-height:1.8;
}

/* Section tab content */
.tab-pane{display:none}
.tab-pane.active{display:block}

/* Status bar */
.status-bar{
  padding:5px 14px;
  background:var(--bg);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
}
.status-txt{font-size:9px;color:var(--muted2)}
.status-ok{color:var(--accent)}
</style>
</head>
<body>

<!-- FAKE DESKTOP BG -->
<div style="position:fixed;inset:0;background:linear-gradient(135deg,#070d14 0%,#0c1521 50%,#080f18 100%);z-index:-1">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,.008) 40px,rgba(255,255,255,.008) 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,.008) 40px,rgba(255,255,255,.008) 41px)"></div>
  <div style="position:absolute;top:40px;left:40px;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(0,200,150,.15);line-height:2">
    ◈ POLYAI<br>smart money tracker<br>v1.0.0<br><br>
    monitoring 500 wallets<br>conviction threshold: 75<br>poll interval: 60m
  </div>
</div>

<!-- SYSTEM TRAY PANEL -->
<div id="panel">
  <!-- Header -->
  <div class="panel-header">
    <div class="panel-logo">◈</div>
    <div>
      <div class="panel-title">POLYAI</div>
      <div class="panel-sub">Polymarket Smart Money</div>
    </div>
    <div class="live-dot" id="liveDot"></div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-cell">
      <div class="stat-val" id="sWallets">—</div>
      <div class="stat-lbl">Wallets</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val" id="sClusters">—</div>
      <div class="stat-lbl">Clusters</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val" id="sAlerts" style="color:var(--warn)">—</div>
      <div class="stat-lbl">TG Alerts</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('clusters',this)">Clusters</div>
    <div class="tab" onclick="switchTab('wallets',this)">Wallets</div>
    <div class="tab" onclick="switchTab('alerts',this)">Alerts</div>
  </div>

  <!-- Body -->
  <div class="panel-body">
    <!-- CLUSTERS -->
    <div class="tab-pane active" id="tab-clusters">
      <div id="clusterList"></div>
    </div>
    <!-- WALLETS -->
    <div class="tab-pane" id="tab-wallets">
      <table class="wallet-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Wallet</th>
            <th>Profit</th>
            <th>ROI 30d</th>
            <th>Win%</th>
          </tr>
        </thead>
        <tbody id="walletBody"></tbody>
      </table>
    </div>
    <!-- ALERTS -->
    <div class="tab-pane" id="tab-alerts">
      <div id="alertList"></div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-txt" id="lastRunTxt">Never run</span>
    <span class="status-txt" id="nextRunTxt"></span>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <button class="btn" onclick="testTelegram()">TG TEST</button>
    <button class="btn primary" id="runBtn" onclick="runPipeline()">▶ RUN NOW</button>
  </div>
</div>

<!-- TASKBAR -->
<div id="taskbar">
  <div class="tray-clock" id="clock"></div>
  <div class="tray-icon" id="trayIcon" onclick="togglePanel()" title="POLYAI — Click to open">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="8,2 14,14 2,14" fill="none" stroke="#00c896" stroke-width="1.2"/>
      <circle cx="8" cy="10" r="1.5" fill="#00c896"/>
      <line x1="8" y1="6" x2="8" y2="8.2" stroke="#00c896" stroke-width="1.2"/>
    </svg>
    <div class="notif-badge" id="badge" style="display:none">0</div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'http://localhost:8000/api'
let panelOpen = false
let alertCount = 0

function togglePanel(){
  panelOpen = !panelOpen
  document.getElementById('panel').classList.toggle('open', panelOpen)
  if(panelOpen){
    hideBadge()
    loadAll()
  }
}

function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'))
  el.classList.add('active')
  document.getElementById('tab-'+name).classList.add('active')
  if(name==='wallets') loadWallets()
  if(name==='alerts')  loadAlerts()
}

function showToast(msg, dur=3000){
  const t=document.getElementById('toast')
  t.textContent=msg
  t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),dur)
}

function showBadge(n){
  const b=document.getElementById('badge')
  b.textContent=n
  b.style.display='flex'
}
function hideBadge(){
  document.getElementById('badge').style.display='none'
}

function convColor(s){
  if(s>=85) return 'var(--danger)'
  if(s>=75) return 'var(--warn)'
  return 'var(--accent)'
}

function fmtUSDC(n){
  if(!n) return '$0'
  if(n>=1e6) return '$'+(n/1e6).toFixed(1)+'M'
  if(n>=1e3) return '$'+(n/1e3).toFixed(1)+'K'
  return '$'+Math.round(n)
}
function timeAgo(iso){
  if(!iso) return '—'
  const d=(Date.now()-new Date(iso).getTime())/1000
  if(d<60) return Math.round(d)+'s ago'
  if(d<3600) return Math.round(d/60)+'m ago'
  return Math.round(d/3600)+'h ago'
}

async function apiFetch(path){
  const r=await fetch(API+path)
  if(!r.ok) throw new Error(r.status)
  return r.json()
}

async function loadStats(){
  try{
    const s=await apiFetch('/stats')
    document.getElementById('sWallets').textContent=s.wallets_tracked||0
    document.getElementById('sClusters').textContent=s.clusters_detected||0
    document.getElementById('sAlerts').textContent=s.alerts_sent||0
  }catch(e){
    document.getElementById('sWallets').textContent='—'
  }
}

async function loadStatus(){
  try{
    const s=await apiFetch('/status')
    const lr=s.last_run
    if(lr&&lr.run_at){
      document.getElementById('lastRunTxt').innerHTML=
        `<span class="status-ok">●</span> Last: ${timeAgo(lr.run_at)} · ${lr.wallets_qualified||0} wallets`
    }
    if(s.next_run){
      const mins=Math.max(0,Math.round((new Date(s.next_run)-Date.now())/60000))
      document.getElementById('nextRunTxt').textContent=`Next in ${mins}m`
    }
  }catch(e){
    document.getElementById('lastRunTxt').textContent='Backend offline'
    document.getElementById('liveDot').style.background='var(--danger)'
  }
}

async function loadClusters(){
  const list=document.getElementById('clusterList')
  try{
    const data=await apiFetch('/clusters?limit=20')
    if(!data.length){
      list.innerHTML='<div class="empty">No clusters detected yet.<br>Run the pipeline to begin monitoring.</div>'
      return
    }
    list.innerHTML=data.map(c=>{
      const col=convColor(c.conviction_score)
      const pct=Math.min(100,c.conviction_score)
      return `
      <div class="cluster-card">
        <div class="cluster-top">
          <div class="cluster-q">${c.market_question||c.market_id}</div>
          <div class="outcome-badge ${c.outcome==='YES'?'yes':'no'}">${c.outcome}</div>
        </div>
        <div class="conv-bar-wrap">
          <div class="conv-track"><div class="conv-fill" style="width:${pct}%;background:${col}"></div></div>
          <span class="conv-score" style="color:${col}">${c.conviction_score.toFixed(0)}</span>
        </div>
        <div class="cluster-meta">
          <div class="meta-item">
            <div class="meta-label">Wallets</div>
            <div class="meta-val">${c.wallet_count}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Avg ROI</div>
            <div class="meta-val" style="color:var(--accent)">+${c.avg_roi.toFixed(1)}%</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Size</div>
            <div class="meta-val">${fmtUSDC(c.total_size_usdc)}</div>
          </div>
        </div>
        ${c.alert_sent?'<div class="tg-sent">📨 TG alert sent · '+timeAgo(c.detected_at)+'</div>':'<div style="font-size:9px;color:var(--muted2);margin-top:4px">'+timeAgo(c.detected_at)+'</div>'}
      </div>`
    }).join('')
  }catch(e){
    list.innerHTML='<div class="empty">Backend offline.<br>Start python main.py first.</div>'
  }
}

async function loadWallets(){
  const body=document.getElementById('walletBody')
  try{
    const data=await apiFetch('/wallets?limit=50')
    if(!data.wallets.length){
      body.innerHTML='<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted2)">No wallets yet</td></tr>'
      return
    }
    body.innerHTML=data.wallets.map(w=>`
      <tr>
        <td class="w-rank">${w.rank}</td>
        <td><a href="https://polymarket.com/profile/${w.address}" target="_blank" class="w-addr">${w.short}</a></td>
        <td class="pos">${fmtUSDC(w.total_profit)}</td>
        <td class="${w.roi_30d>=0?'pos':'neg'}">${w.roi_30d>=0?'+':''}${w.roi_30d.toFixed(1)}%</td>
        <td>${w.win_rate.toFixed(0)}%</td>
      </tr>
    `).join('')
  }catch(e){
    body.innerHTML='<tr><td colspan="5" style="text-align:center;padding:16px;color:var(--muted2)">Offline</td></tr>'
  }
}

async function loadAlerts(){
  const list=document.getElementById('alertList')
  try{
    const data=await apiFetch('/alerts?limit=20')
    if(!data.length){
      list.innerHTML='<div class="empty">No alerts sent yet.<br>Conviction must exceed 75 to fire.</div>'
      return
    }
    list.innerHTML=data.map(a=>`
      <div class="alert-item">
        <div class="alert-icon">${a.success?'📨':'❌'}</div>
        <div style="flex:1;min-width:0">
          <div class="alert-q">${a.market_question}</div>
          <div class="alert-meta">${timeAgo(a.sent_at)}</div>
        </div>
        <div class="alert-score" style="color:${convColor(a.conviction_score)}">${a.conviction_score.toFixed(0)}</div>
      </div>
    `).join('')
  }catch(e){
    list.innerHTML='<div class="empty">Offline</div>'
  }
}

async function loadAll(){
  await Promise.all([loadStats(), loadStatus(), loadClusters()])
}

async function runPipeline(){
  const btn=document.getElementById('runBtn')
  btn.disabled=true
  btn.textContent='⟳ RUNNING…'
  try{
    await fetch(API+'/pipeline/run',{method:'POST'})
    showToast('✅ Pipeline complete')
    await loadAll()
  }catch(e){
    showToast('❌ Backend offline — start python main.py')
  }
  btn.disabled=false
  btn.textContent='▶ RUN NOW'
}

async function testTelegram(){
  showToast('Sending test alert…')
  try{
    const r=await fetch(API+'/alerts/test',{method:'POST'})
    const d=await r.json()
    showToast(d.success?'✅ TG message sent! Check your bot':'❌ TG failed — check .env tokens', 4000)
  }catch(e){
    showToast('❌ Backend offline')
  }
}

// Clock
function updateClock(){
  const now=new Date()
  const t=now.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})
  const d=now.toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit',year:'2-digit'})
  document.getElementById('clock').innerHTML=t+'<br>'+d
}
updateClock()
setInterval(updateClock,1000)

// Auto-refresh when open
setInterval(()=>{if(panelOpen) loadAll()},30000)

// Check for new alerts periodically (even when closed)
setInterval(async()=>{
  try{
    const s=await apiFetch('/stats')
    const newCount=s.alerts_sent||0
    if(newCount>alertCount && alertCount>0){
      showBadge(newCount-alertCount)
    }
    alertCount=newCount
  }catch(e){}
},60000)

// Load stats on first check
apiFetch('/stats').then(s=>{alertCount=s.alerts_sent||0}).catch(()=>{})
</script>
</body>
</html>
